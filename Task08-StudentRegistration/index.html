<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Header -->
                <div class="header-section mb-5">
                    <h1 class="text-center mb-2">Student Registration System</h1>
                    <p class="text-center text-muted">Fill in your details below to register</p>
                </div>

                <!-- Registration Form -->
                <div class="card shadow-lg border-0 mb-5">
                    <div class="card-body p-4">
                        <form id="registrationForm" novalidate>
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="fullName" 
                                    placeholder="Enter your full name"
                                    required>
                                <div class="error-message" id="fullNameError"></div>
                            </div>

                            <!-- Email Address -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="email" 
                                    placeholder="Enter your email address"
                                    required>
                                <div class="error-message" id="emailError"></div>
                            </div>

                            <!-- Phone Number -->
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input 
                                    type="tel" 
                                    class="form-control" 
                                    id="phone" 
                                    placeholder="Enter your phone number"
                                    required>
                                <div class="error-message" id="phoneError"></div>
                            </div>

                            <!-- Course Name -->
                            <div class="mb-3">
                                <label for="course" class="form-label fw-semibold">Course Name</label>
                                <select class="form-select" id="course" required>
                                    <option value="" selected disabled>Select a course</option>
                                    <option value="Web Development">Web Development</option>
                                    <option value="Data Science">Data Science</option>
                                    <option value="Mobile Development">Mobile Development</option>
                                    <option value="Cloud Computing">Cloud Computing</option>
                                    <option value="AI & Machine Learning">AI & Machine Learning</option>
                                    <option value="Cybersecurity">Cybersecurity</option>
                                </select>
                                <div class="error-message" id="courseError"></div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                    Register
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Registered Students Table -->
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white p-3">
                        <h5 class="mb-0">Registered Students</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" id="studentsTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>Full Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Course</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <tr id="emptyMessage">
                                        <td colspan="5" class="text-center text-muted py-4">
                                            No students registered yet. Submit the form to add a student.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Edit Modal -->
                <div class="modal fade" id="editModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title">Edit Student Information</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="editForm">
                                    <div class="mb-3">
                                        <label for="editFullName" class="form-label fw-semibold">Full Name</label>
                                        <input type="text" class="form-control" id="editFullName" required>
                                        <div class="error-message" id="editFullNameError"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editEmail" class="form-label fw-semibold">Email Address</label>
                                        <input type="email" class="form-control" id="editEmail" required>
                                        <div class="error-message" id="editEmailError"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editPhone" class="form-label fw-semibold">Phone Number</label>
                                        <input type="tel" class="form-control" id="editPhone" required>
                                        <div class="error-message" id="editPhoneError"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editCourse" class="form-label fw-semibold">Course Name</label>
                                        <select class="form-select" id="editCourse" required>
                                            <option value="Web Development">Web Development</option>
                                            <option value="Data Science">Data Science</option>
                                            <option value="Mobile Development">Mobile Development</option>
                                            <option value="Cloud Computing">Cloud Computing</option>
                                            <option value="AI & Machine Learning">AI & Machine Learning</option>
                                            <option value="Cybersecurity">Cybersecurity</option>
                                        </select>
                                        <div class="error-message" id="editCourseError"></div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
