<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Information - Furnitur</title>
  <link href="css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>main{padding:80px 20px;}</style>
</head>
<body>
  <!-- reuse header from other pages (kept minimal) -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo"><span class="logo-title">FURNITUR</span><span class="logo-subtitle">YOUR FUTURE INTERIOR</span></a>
    </div>
  </header>
  <main class="container">
    <h2 class="section-title">Customer Information</h2>
    <p class="section-subtitle">Provide contact details</p>
    <form id="customerForm" style="max-width:600px;margin:24px 0;">
      <div style="display:flex;gap:12px;margin-bottom:12px;"><input name="fullname" required placeholder="Full name" style="flex:1;padding:10px;border:1px solid var(--border)"><input name="phone" placeholder="Phone" style="width:160px;padding:10px;border:1px solid var(--border)"></div>
      <div style="margin-bottom:12px;"><input name="email" type="email" required placeholder="Email" style="width:100%;padding:10px;border:1px solid var(--border)"></div>
      <div style="display:flex;gap:12px;margin-bottom:12px;"><input name="address" placeholder="Address" required style="flex:1;padding:10px;border:1px solid var(--border)"><input name="city" placeholder="City" style="width:180px;padding:10px;border:1px solid var(--border)"></div>
      <div style="display:flex;gap:12px;margin-bottom:12px;"><input name="postcode" placeholder="Postcode" style="width:180px;padding:10px;border:1px solid var(--border)"><input name="country" placeholder="Country" style="flex:1;padding:10px;border:1px solid var(--border)"></div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn-dark">Continue to Shipping</button>
        <a href="cart.html" style="align-self:center;margin-left:10px;color:var(--primary)">Back to cart</a>
      </div>
    </form>
  </main>
  <script src="js/checkout.js"></script>
</body>
</html>
